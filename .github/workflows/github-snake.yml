name: generate snake animation

on:
  schedule:
    - cron: "0 3 * * *"     # runs daily at 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: sarthakkaushik927
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ec4899
            dist/github-snake-light.svg?color_snake=#8b5cf6&color_dots=#f5d9ff,#f0abfc,#e879f9,#c026d3,#86198f

      - name: push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
